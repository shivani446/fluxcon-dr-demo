apiVersion: v1
kind: Namespace
metadata:
  name: velero
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vmware-tanzu
  namespace: flux-system
spec:
  interval: 1h
  url: https://vmware-tanzu.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 30m
  chart:
    spec:
      chart: velero
      version: ">=12.0.0"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    image:
      repository: velero/velero
      tag: v1.18.0
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.0
        volumeMounts:
          - mountPath: /target
            name: plugins
    deployNodeAgent: true
    snapshotsEnabled: false
    credentials:
      useSecret: true
      existingSecret: velero-minio-creds   # created outside Git (scripts/03-prep-cluster.sh)
    configuration:
      uploaderType: kopia
      defaultVolumesToFsBackup: true
      backupSyncPeriod: 10s               # new cluster sees old backups fast
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: velero
          default: true
          config:
            region: minio
            s3ForcePathStyle: "true"
            s3Url: http://${HOST_IP}:9000
      volumeSnapshotLocation: []
